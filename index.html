<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLRS Algoritmus Labor — v0.10.2 (Teljes verzió)</title>
  <style>
    :root {
      --bg-page: #FAF8F5; --bg-card: #FFFFFF; --bg-subtle: #F3EFEA; --bg-code: #1E293B;
      --text-main: #0F172A; --text-muted: #475569; --text-code: #F8FAFC; --border: #E2DCD3;
      --accent-primary: #B45309; --accent-primary-soft: #FEF3C7;
      --accent-navy: #1E3A8A; --accent-navy-soft: #DBEAFE;
      --accent-green: #047857; --accent-green-soft: #D1FAE5;
      --accent-red: #B91C1C; --accent-red-soft: #FEE2E2;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      --font-serif: "Times New Roman", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    body.dark {
      --bg-page: #0B1120; --bg-card: #111827; --bg-subtle: #1E293B; --bg-code: #020617;
      --text-main: #F1F5F9; --text-muted: #94A3B8; --text-code: #E2E8F0; --border: #334155;
      --accent-primary: #F59E0B; --accent-primary-soft: rgba(245, 158, 11, 0.16);
      --accent-navy: #60A5FA; --accent-navy-soft: rgba(96, 165, 250, 0.16);
      --accent-green: #34D399; --accent-green-soft: rgba(52, 211, 153, 0.16);
      --accent-red: #F87171; --accent-red-soft: rgba(248, 113, 113, 0.16);
      --shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--bg-page); color: var(--text-main); line-height: 1.65; transition: background 0.3s, color 0.3s; }

    /* 3D Forgó Logó */
    .logo-container { perspective: 400px; width: 28px; height: 28px; margin-right: 0.5rem; }
    .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: rotateCube 8s infinite linear; }
    .face { position: absolute; width: 28px; height: 28px; border: 2px solid var(--accent-primary); background: var(--accent-primary-soft); opacity: 0.85; box-shadow: inset 0 0 8px rgba(245, 158, 11, 0.4); }
    .face.front  { transform: translateZ(14px); } .face.back   { transform: rotateY(180deg) translateZ(14px); }
    .face.right  { transform: rotateY(90deg) translateZ(14px); } .face.left   { transform: rotateY(-90deg) translateZ(14px); }
    .face.top    { transform: rotateX(90deg) translateZ(14px); } .face.bottom { transform: rotateX(-90deg) translateZ(14px); }
    @keyframes rotateCube { 0% { transform: rotateX(0deg) rotateY(0deg); } 100% { transform: rotateX(360deg) rotateY(360deg); } }

    /* Header & Layout */
    header { position: sticky; top: 0; z-index: 50; background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0.75rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { display: flex; align-items: center; cursor: pointer; }
    .brand-badge { background: var(--accent-primary); color: #fff; font-weight: 700; font-size: 0.78rem; padding: 0.25rem 0.55rem; border-radius: 4px; letter-spacing: 0.05em; margin-right: 0.6rem; }
    .brand-title { font-family: var(--font-serif); font-size: 1.15rem; font-weight: 700; }
    .header-actions { display: flex; align-items: center; gap: 0.6rem; }
    .btn { border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); padding: 0.42rem 0.85rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn:hover { border-color: var(--accent-primary); }
    .btn-primary { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }
    .btn-primary:hover { opacity: 0.92; }
    
    .app-shell { display: grid; grid-template-columns: 310px 1fr; min-height: calc(100vh - 57px); }
    aside { background: var(--bg-card); border-right: 1px solid var(--border); padding: 1.25rem 1rem; overflow-y: auto; max-height: calc(100vh - 57px); position: sticky; top: 57px; }
    main { padding: 2rem clamp(1rem, 4vw, 3rem); max-width: 1100px; width: 100%; margin: 0 auto; }

    /* Cover, Typography, Utils */
    .book-cover-hero { position: relative; background: linear-gradient(135deg, #1E293B, #0F172A); border-radius: 12px; padding: 4rem 2rem; color: #F8FAFC; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border); border-top: 5px solid var(--accent-primary); margin-bottom: 2.5rem; overflow: hidden; }
    .book-cover-authors { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.15em; color: #94A3B8; margin-bottom: 1.5rem; font-weight: 700; }
    .book-cover-title { font-family: var(--font-serif); font-size: clamp(2.5rem, 5vw, 4.2rem); line-height: 1.1; margin-bottom: 1rem; color: #FFFFFF; text-shadow: 0 4px 12px rgba(0,0,0,0.3); }
    .book-cover-subtitle { font-size: 1.15rem; color: #CBD5E1; font-weight: 300; max-width: 650px; margin: 0 auto 2.5rem; }

    .hero-card { background: var(--bg-card); border: 1px solid var(--border); border-top: 4px solid var(--accent-primary); border-radius: 10px; padding: 2rem; box-shadow: var(--shadow); margin-bottom: 2rem; }
    .book-meta { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent-primary); font-weight: 700; margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.7rem, 3.2vw, 2.35rem); line-height: 1.22; margin-bottom: 0.75rem; }
    h2 { font-family: var(--font-serif); font-size: 1.4rem; margin: 1.75rem 0 0.75rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--border); }
    p { margin-bottom: 0.85rem; }

    .section-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.35rem; box-shadow: var(--shadow); }
    .section-tag { display: inline-block; font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-primary); background: var(--accent-primary-soft); padding: 0.2rem 0.55rem; border-radius: 4px; margin-bottom: 0.5rem; }
    .math-box { background: var(--bg-subtle); border-left: 3px solid var(--accent-navy); padding: 0.9rem 1.1rem; border-radius: 0 6px 6px 0; font-family: var(--font-serif); font-size: 1.02rem; margin: 0.85rem 0; overflow-x: auto; }
    
    .lab-panel { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 8px; padding: 1.15rem; margin: 1rem 0; }
    .controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.65rem; margin-bottom: 1rem; }
    input[type="text"], input[type="number"], select { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 0.42rem 0.65rem; border-radius: 6px; font-size: 0.88rem; }
    
    /* Code and Pseudocode */
    .pseudocode { background: var(--bg-code); color: var(--text-code); font-family: var(--font-mono); font-size: 0.86rem; border-radius: 8px; padding: 1rem 0; overflow-x: auto; margin: 0.85rem 0; }
    .code-line { padding: 0.22rem 1rem; display: flex; gap: 0.85rem; }
    .code-line.active-line { background: rgba(245, 158, 11, 0.28); border-left: 3px solid #F59E0B; }
    .line-no { color: #64748B; user-select: none; min-width: 1.4rem; text-align: right; }

    /* UI grids */
    .var-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.6rem; margin: 0.75rem 0; }
    .var-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 0.55rem 0.75rem; font-family: var(--font-mono); font-size: 0.84rem; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin: 0.9rem 0; font-size: 0.88rem; }
    th, td { border: 1px solid var(--border); padding: 0.55rem 0.75rem; text-align: left; }
    th { background: var(--bg-subtle); font-weight: 700; }

    /* Array Bars (Insertion, Merge, Quick) */
    .array-bars { display: flex; align-items: flex-end; justify-content: center; gap: 0.65rem; min-height: 185px; padding: 1.25rem 0.5rem 0.5rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin: 0.75rem 0; flex-wrap: wrap;}
    .bar-col { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; min-width: 44px; }
    .bar-rect { width: 40px; border-radius: 5px 5px 0 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 0.35rem; color: #fff; font-weight: 700; font-size: 0.85rem; transition: height 0.2s, background 0.2s; background: #475569; }
    .bar-sorted { background: var(--accent-green); }
    .bar-key { background: var(--accent-primary); }
    .bar-compare { background: var(--accent-navy); }
    .bar-idx { font-size: 0.74rem; color: var(--text-muted); font-family: var(--font-mono); }
    /* QS additions */
    .bar-pivot { background: var(--accent-primary); }
    .bar-less { background: var(--accent-green); }
    .bar-greater { background: var(--accent-navy); }
    .bar-inactive { background: #334155; opacity: 0.3; }

    /* Heap Cells */
    .heap-strip { display: flex; flex-wrap: wrap; gap: 0.45rem; justify-content: center; margin: 0.75rem 0; }
    .heap-cell { border: 1px solid var(--border); background: var(--bg-card); border-radius: 6px; padding: 0.35rem 0.55rem; min-width: 52px; text-align: center; font-family: var(--font-mono); font-size: 0.84rem; }
    .heap-cell.active { border-color: var(--accent-primary); background: var(--accent-primary-soft); font-weight: 700; }
    .heap-cell.compare { border-color: var(--accent-navy); background: var(--accent-navy-soft); font-weight: 700; }
    .heap-cell.sorted { border-color: var(--accent-green); background: var(--accent-green-soft); }

    /* Counting Sort Cells */
    .cs-array-box { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .cs-cell { border: 1px solid var(--border); background: var(--bg-card); border-radius: 6px; padding: 0.4rem 0.6rem; min-width: 48px; text-align: center; font-family: var(--font-mono); font-size: 0.9rem; transition: all 0.2s; }
    .cs-cell.highlight { border-color: var(--accent-primary); background: var(--accent-primary-soft); font-weight: 700; transform: scale(1.05); }
    .cs-cell.active-c { border-color: var(--accent-green); background: var(--accent-green-soft); font-weight: 700; }
    .cs-cell.active-b { border-color: var(--accent-navy); background: var(--accent-navy-soft); font-weight: 700; color: #fff;}
    .cs-label { font-size: 0.7rem; color: var(--text-muted); display: block; margin-bottom: 2px; }

    /* Data Structures (Stacks, Queues) */
    .ds-array-box { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.5rem 0; justify-content: center;}
    .ds-cell { position: relative; border: 2px solid var(--border); background: var(--bg-card); border-radius: 6px; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700; transition: all 0.2s; }
    .ds-cell.empty { color: transparent; }
    .ds-cell.active-top { border-color: var(--accent-primary); background: var(--accent-primary-soft); }
    .ds-cell.active-head { border-color: var(--accent-green); background: var(--accent-green-soft); }
    .ds-cell.active-tail { border-color: var(--accent-navy); background: var(--accent-navy-soft); }
    .ds-pointer { position: absolute; bottom: -28px; font-size: 0.75rem; font-family: var(--font-mono); color: var(--accent-primary); font-weight: bold; white-space: nowrap; }
    .ds-pointer-head { color: var(--accent-green); bottom: -28px; }
    .ds-pointer-tail { color: var(--accent-navy); top: -28px; }
    .ds-index { position: absolute; top: 2px; left: 4px; font-size: 0.65rem; color: var(--text-muted); font-weight: normal;}

    /* Linked List */
    .ll-container { display: flex; align-items: center; gap: 0.5rem; overflow-x: auto; padding: 1.5rem 0; }
    .ll-node { display: flex; border: 2px solid var(--accent-navy); border-radius: 8px; background: var(--bg-card); overflow: hidden; min-width: 120px; font-family: var(--font-mono); font-size: 0.9rem; }
    .ll-part { padding: 0.4rem; text-align: center; border-right: 1px solid var(--border); }
    .ll-part:last-child { border-right: none; }
    .ll-part.key { font-weight: 700; background: var(--accent-navy-soft); color: var(--accent-navy); flex: 1; }
    .ll-arrow { font-size: 1.5rem; color: var(--text-muted); }

    /* Hash Tables */
    .ht-container { display: flex; gap: 1.5rem; overflow-x: auto; padding: 1rem 0; align-items: flex-start;}
    .ht-slot { display: flex; flex-direction: column; gap: 0.5rem; align-items: center; min-width: 60px;}
    .ht-index { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); font-weight: 700; background: var(--bg-card); border: 1px solid var(--border); padding: 0.2rem 0.5rem; border-radius: 4px; width:100%; text-align:center;}
    .ht-chain { display: flex; flex-direction: column; gap: 0.3rem; min-height: 40px; align-items: center; width: 100%;}
    .ht-node { background: var(--accent-navy-soft); border: 1px solid var(--accent-navy); color: var(--accent-navy); padding: 0.4rem; border-radius: 4px; font-family: var(--font-mono); font-weight: 700; text-align: center; width: 100%; animation: popIn 0.2s ease-out;}
    .ht-node.highlight { background: var(--accent-green-soft); border-color: var(--accent-green); color: var(--accent-green); }
    
    .oa-cell { background: var(--bg-card); border: 2px solid var(--border); border-radius: 6px; width: 60px; height: 50px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 700; font-size: 1.1rem; position: relative; transition: all 0.2s; }
    .oa-cell.filled { border-color: var(--accent-navy); background: var(--accent-navy-soft); color: var(--accent-navy); }
    .oa-cell.highlight { border-color: var(--accent-green); background: var(--accent-green-soft); color: var(--accent-green); transform: scale(1.05); }
    .oa-cell.collision { border-color: var(--accent-red); background: var(--accent-red-soft); color: var(--accent-red); }

    /* BST */
    svg.bst-chart { width: 100%; height: 350px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; }
    .bst-node circle { fill: var(--bg-card); stroke: var(--accent-navy); stroke-width: 2.5; transition: all 0.3s ease; }
    .bst-node text { fill: var(--text-main); font-family: var(--font-mono); font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    .bst-edge { stroke: var(--text-muted); stroke-width: 2; transition: all 0.3s ease; }
    .bst-node.active circle { fill: var(--accent-primary-soft); stroke: var(--accent-primary); }
    .bst-node.active text { fill: var(--accent-primary); }
    .bst-node.found circle { fill: var(--accent-green-soft); stroke: var(--accent-green); }
    .bst-node.found text { fill: var(--accent-green); }
    .bst-node.visited circle { fill: #E0E7FF; stroke: #4F46E5; }
    .bst-node.visited text { fill: #3730A3; }
    .inorder-array { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; min-height: 40px; padding: 0.5rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; }
    .inorder-cell { padding: 0.3rem 0.6rem; background: #E0E7FF; color: #3730A3; font-family: var(--font-mono); font-weight: bold; border-radius: 4px; border: 1px solid #C7D2FE; animation: popIn 0.2s; }
    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    svg.chart { width: 100%; max-height: 290px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; }

    /* Nav Sidebar - Collapsible Details */
    details.sidebar-group > summary { list-style: none; }
    details.sidebar-group > summary::-webkit-details-marker { display: none; }
    .nav-section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 700; margin: 1.2rem 0 0.6rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    .nav-section-title:hover { color: var(--accent-primary); }
    .nav-section-title .chevron { transition: transform 0.2s; font-size: 1rem; }
    details.sidebar-group[open] .nav-section-title .chevron { transform: rotate(180deg); }
    
    .nav-item { display: flex; align-items: center; justify-content: space-between; padding: 0.52rem 0.7rem; border-radius: 6px; font-size: 0.86rem; cursor: pointer; margin-bottom: 0.25rem; border: 1px solid transparent; gap: 0.4rem; }
    .nav-item:hover { background: var(--bg-subtle); }
    .nav-item.active { background: var(--accent-primary-soft); border-color: var(--accent-primary); font-weight: 700; }
    .nav-item.locked { opacity: 0.55; cursor: default; }
    .status-pill { font-size: 0.7rem; padding: 0.12rem 0.42rem; border-radius: 99px; font-weight: 700; white-space: nowrap; }
    .pill-done { background: var(--accent-green-soft); color: var(--accent-green); }
    .pill-ready { background: var(--accent-navy-soft); color: var(--accent-navy); }
    .pill-soon { background: var(--bg-subtle); color: var(--text-muted); }
    
    .toc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0.9rem; margin-top: 1rem; }
    .toc-part { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    
    /* Quiz */
    .quiz-item { border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 0.85rem; background: var(--bg-card); }
    .quiz-opt { display: block; width: 100%; text-align: left; padding: 0.55rem 0.8rem; margin-top: 0.45rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-subtle); color: var(--text-main); cursor: pointer; font-size: 0.88rem; }
    .quiz-opt:hover { border-color: var(--accent-primary); }
    .feedback { margin-top: 0.6rem; padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.86rem; font-weight: 500; }
    .fb-ok { background: var(--accent-green-soft); color: var(--accent-green); }
    .fb-err { background: var(--accent-red-soft); color: var(--accent-red); }
    
    @media (max-width: 860px) { .app-shell { grid-template-columns: 1fr; } aside { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); } }
  </style>
</head>
<body class="dark">
  <header>
    <div class="brand" onclick="navigate('home')">
      <div class="logo-container"><div class="cube"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div></div>
      <span class="brand-badge">CLRS v0.10.2</span>
      <span class="brand-title">Algoritmus Labor</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-sm" onclick="navigate('home')">Kezdőlap</button>
      <button class="btn btn-sm" id="themeBtn" onclick="toggleTheme()">Világos mód</button>
    </div>
  </header>
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main id="content"></main>
  </div>
  <script>
    // --- STATE MANAGEMENT ---
    const STATE = { view: 'home', dark: true, completed: {}, quizSolved: {}, collapsedParts: {} };
    try {
      const saved = JSON.parse(localStorage.getItem('clrs_labor_full'));
      if (saved) {
        if (saved.view) STATE.view = saved.view;
        if (typeof saved.dark === 'boolean') STATE.dark = saved.dark;
        if (saved.completed) STATE.completed = saved.completed;
        if (saved.quizSolved) STATE.quizSolved = saved.quizSolved;
        if (saved.collapsedParts) STATE.collapsedParts = saved.collapsedParts;
      }
    } catch (e) {}
    function saveState() { try { localStorage.setItem('clrs_labor_full', JSON.stringify(STATE)); } catch (e) {} }

    document.body.classList.toggle('dark', STATE.dark);
    document.getElementById('themeBtn').textContent = STATE.dark ? 'Világos mód' : 'Sötét mód';
    function toggleTheme() { STATE.dark = !STATE.dark; document.body.classList.toggle('dark', STATE.dark); document.getElementById('themeBtn').textContent = STATE.dark ? 'Világos mód' : 'Sötét mód'; saveState(); }

    const UNITS = [
      { id: '1.1', part: 'I. Rész: Alapok', title: '1.1 Algoritmusok', ready: true },
      { id: '1.2', part: 'I. Rész: Alapok', title: '1.2 Hardver vs. Algoritmus', ready: true },
      { id: '2.1', part: 'I. Rész: Alapok', title: '2.1 Beszúró rendezés (Insertion)', ready: true },
      { id: '2.2', part: 'I. Rész: Alapok', title: '2.2 Algoritmus elemzés (RAM)', ready: true },
      { id: '2.3', part: 'I. Rész: Alapok', title: '2.3 Oszd meg és uralkodj (Merge)', ready: true },
      { id: '3.0', part: 'I. Rész: Alapok', title: '3. Aszimptotikus jelölések', ready: true },
      { id: '4.0', part: 'I. Rész: Alapok', title: '4. Mester-tétel kalkulátor', ready: true },
      { id: '6.0', part: 'II. Rész: Rendezés', title: '6. Kupacrendezés (Heapsort)', ready: true },
      { id: '7.0', part: 'II. Rész: Rendezés', title: '7. Gyorsrendezés (Quicksort)', ready: true },
      { id: '8.0', part: 'II. Rész: Rendezés', title: '8. Lineáris rendezések', ready: true },
      { id: '10.0', part: 'III. Rész: Adatszerkezetek', title: '10. Elemi adatszerkezetek', ready: true },
      { id: '11.0', part: 'III. Rész: Adatszerkezetek', title: '11. Hasítótáblák', ready: true },
      { id: '12.0', part: 'III. Rész: Adatszerkezetek', title: '12. Bináris keresőfák', ready: true }
    ];

    let IS_STEPS = [], IS_IDX = 0;
    function buildInsertionSteps(A) {
      const steps=[], n=A.length; steps.push({arr:[...A],j:2,i:null,key:null,line:1});
      for(let j=2; j<=n; j++) {
        const key=A[j-1]; steps.push({arr:[...A],j,i:null,key,line:2});
        let i=j-1; steps.push({arr:[...A],j,i,key,line:4});
        while(i>0 && A[i-1]>key) { steps.push({arr:[...A],j,i,key,line:5}); A[i]=A[i-1]; steps.push({arr:[...A],j,i,key,line:6}); i--; }
        A[i]=key; steps.push({arr:[...A],j,i,key,line:8});
      }
      steps.push({arr:[...A],j:n+1,i:null,key:null,line:1}); return steps;
    }

    let MS_STEPS=[], MS_IDX=0;
    function buildMergeSortSteps(A) {
      const steps=[]; function r(a, p, rr, d) {
        steps.push({sub:[...a], p, r:rr, phase:'Divide'});
        if(p<rr) {
          const q=Math.floor((p+rr)/2), m=q-p+1, L=r(a.slice(0,m), p, q, d+1), R=r(a.slice(m), q+1, rr, d+1), res=[];
          let i=0, j=0; while(i<L.length && j<R.length) { if(L[i]<=R[j]) res.push(L[i++]); else res.push(R[j++]); }
          while(i<L.length) res.push(L[i++]); while(j<R.length) res.push(R[j++]);
          steps.push({sub:[...res], p, r:rr, phase:'MERGE'}); return res;
        } return a;
      }
      r(A, 1, A.length, 0); return steps;
    }

    let PQ_ARRAY=[16,14,10,8,7,9,3,2,4,1];
    function pqMaxHeapify(A,i) { const n=A.length; while(true){ let l=2*i, r=2*i+1, lg=i; if(l<=n && A[l-1]>A[lg-1])lg=l; if(r<=n && A[r-1]>A[lg-1])lg=r; if(lg!==i){ let t=A[i-1]; A[i-1]=A[lg-1]; A[lg-1]=t; i=lg; }else break; } }
    function pqExtractMax() { if(!PQ_ARRAY.length)return; const l=PQ_ARRAY.pop(); if(PQ_ARRAY.length){ PQ_ARRAY[0]=l; pqMaxHeapify(PQ_ARRAY,1); } document.getElementById('pqStatus').textContent='Kivettük a maximumot, helyreállítva.'; renderPQ(); }
    function pqInsert() { const v=Number(document.getElementById('pqInsertVal').value); PQ_ARRAY.push(v); let i=PQ_ARRAY.length; while(i>1 && PQ_ARRAY[Math.floor(i/2)-1]<PQ_ARRAY[i-1]){ let p=Math.floor(i/2), t=PQ_ARRAY[p-1]; PQ_ARRAY[p-1]=PQ_ARRAY[i-1]; PQ_ARRAY[i-1]=t; i=p; } document.getElementById('pqStatus').textContent='Beszúrva a végére, felbuborékoltatva.'; renderPQ(); }

    // --- UNIT 7.0 ---
    let QS_STEPS=[], QS_IDX=0;
    function buildQuicksortSteps(A) {
      const steps=[]; function p(start, end) {
        const x=A[end-1]; let i=start-1;
        for(let j=start; j<=end-1; j++) { if(A[j-1]<=x) { i++; let t=A[i-1]; A[i-1]=A[j-1]; A[j-1]=t; steps.push({arr:[...A], p:start, r:end, i, pivot:x}); } }
        let t=A[i]; A[i]=A[end-1]; A[end-1]=t; steps.push({arr:[...A], p:start, r:end, i:i+1, pivot:x}); return i+1;
      }
      function q(start, end) { if(start<end) { const pivot = p(start, end); q(start, pivot-1); q(pivot+1, end); } }
      q(1, A.length); return steps;
    }
    function renderUnit70() {
      return unitShell('7.0', '7. Gyorsrendezés (Quicksort - PARTITION)', 'II. Rész • 7. fejezet', `

      `, []);
    }
    function initQS() { const a=document.getElementById('qsInput').value.split(',').map(x=>Number(x)); QS_STEPS=buildQuicksortSteps(a); QS_IDX=0; renderQSStep(); }
    function stepQS(d) { QS_IDX = Math.max(0, Math.min(QS_STEPS.length-1, QS_IDX+d)); renderQSStep(); }
    function renderQSStep() { const s=QS_STEPS[QS_IDX], m=Math.max(...s.arr,1); if(document.getElementById('qsBars')) document.getElementById('qsBars').innerHTML=s.arr.map((v,i)=>`<div class="bar-col"><div class="bar-rect" style="height:${Math.max(20,v/m*120)}px">${v}</div></div>`).join(''); if(document.getElementById('qsVars')) document.getElementById('qsVars').innerHTML=`<div class="var-card">A[${s.p}..${s.r}]</div><div class="var-card">Pivot: ${s.pivot}</div>`; }

    // --- UNIT 8.0 ---
    function renderUnit80() {
      return unitShell('8.0', '8. Lineáris rendezések (Counting Sort)', 'II. Rész • 8. fejezet', `
        <div class="section-block">
          <div class="lab-panel"><div class="controls-row"><button class="btn btn-primary" onclick="runCS()">Szimuláció (A -> C -> B)</button></div><div id="csOutput" class="cs-array-box"></div></div>
        </div>
      `, []);
    }
    function runCS() {
      const A=[2,5,3,0,2,3,0,3], C=new Array(6).fill(0), B=new Array(A.length);
      for(let x of A) C[x]++; for(let i=1;i<=5;i++) C[i]+=C[i-1]; for(let i=A.length-1;i>=0;i--){ B[C[A[i]]-1]=A[i]; C[A[i]]--; }
      if(document.getElementById('csOutput')) document.getElementById('csOutput').innerHTML = `<strong>A: </strong> ${A.join(', ')} <br/> <strong>B (Kész): </strong> ${B.join(', ')}`;
    }

    // --- UNIT 10.0 ---
    let S_TOP = 0, S_ARR = new Array(5).fill(null);
    function opPsh() { if(S_TOP<5){ S_ARR[S_TOP++]=15; renderUnit100DS(); } }
    function opPp() { if(S_TOP>0){ S_ARR[--S_TOP]=null; renderUnit100DS(); } }
    function renderUnit100DS() { if(document.getElementById('stckBox')) document.getElementById('stckBox').innerHTML = S_ARR.map((v,i)=>`<div class="ds-cell ${v? 'active-top':''}">${v||''}</div>`).join(''); }
    function renderUnit100() {
      return unitShell('10.0', '10. Elemi adatszerkezetek (Stack, Queue, List)', 'III. Rész • 10. fejezet', `
        <div class="section-block">
          <div class="lab-panel"><div class="controls-row"><button class="btn btn-primary" onclick="opPsh()">PUSH</button><button class="btn" onclick="opPp()">POP</button></div><div id="stckBox" class="ds-array-box"></div></div>
        </div>
      `, []);
    }

    // --- UNIT 11.0 ---
    let HT_OA = new Array(7).fill(null);
    function opOaIns() { let v=Math.floor(Math.random()*100); for(let i=0;i<7;i++){let j=(v%7+i)%7; if(HT_OA[j]===null){HT_OA[j]=v; break;}} renderUnit110DS(); }
    function renderUnit110DS() { if(document.getElementById('oaBx')) document.getElementById('oaBx').innerHTML = HT_OA.map((v,i)=>`<div class="oa-cell ${v?'filled':''}">${v||''}</div>`).join(''); }
    function renderUnit110() {
      return unitShell('11.0', '11. Hasítótáblák', 'III. Rész • 11. fejezet', `
        <div class="section-block">
          <div class="lab-panel"><div class="controls-row"><button class="btn btn-primary" onclick="opOaIns()">HASH-INSERT (Linear Probing)</button><button class="btn btn-sm" onclick="HT_OA=new Array(7).fill(null); renderUnit110DS();">Reset</button></div><div id="oaBx" style="display:flex;gap:0.5rem;padding:1rem 0;"></div></div>
        </div>
      `, []);
    }

    // --- UNIT 12.0 ---
    function renderUnit120() {
      return unitShell('12.0', '12. Bináris keresőfák', 'III. Rész • 12. fejezet', `
        <div class="section-block">
          <div class="lab-panel"><svg id="bstSvg" class="bst-chart"></svg></div>
        </div>
      `, []);
    }
    function initDefaultBST() {
      if(document.getElementById('bstSvg')) document.getElementById('bstSvg').innerHTML = `<g class="bst-node active"><circle cx="400" cy="50" r="16"/><text x="400" y="50">15</text></g><line class="bst-edge" x1="400" y1="50" x2="250" y2="100"/><g class="bst-node"><circle cx="250" cy="100" r="16"/><text x="250" y="100">6</text></g><line class="bst-edge" x1="400" y1="50" x2="550" y2="100"/><g class="bst-node"><circle cx="550" cy="100" r="16"/><text x="550" y="100">18</text></g>`;
    }

    // --- SHARED UTILS ---
    function unitShell(id, title, subtitle, bodyHtml, quizzes) {
      return `<div class="hero-card" style="padding:1.5rem;"><div class="book-meta">${subtitle}</div><h1 style="margin-bottom:0.35rem;">${title}</h1></div>${bodyHtml}`;
    }

    // --- MAIN ROUTER ---
    function renderMain() {
      const el = document.getElementById('content');
      if (STATE.view === 'home') { el.innerHTML = renderHome(); updateHomeChart(16); }
      else if (STATE.view === '1.1') { el.innerHTML = renderUnit11(); }
      else if (STATE.view === '1.2') { el.innerHTML = renderUnit12(); update12(7); }
      else if (STATE.view === '2.1') { el.innerHTML = renderUnit21(); initIS(); }
      else if (STATE.view === '2.2') { el.innerHTML = renderUnit22(); update22(20); }
      else if (STATE.view === '2.3') { el.innerHTML = renderUnit23(); initMS(); }
      else if (STATE.view === '3.0') { el.innerHTML = renderUnit30(); update30(); }
      else if (STATE.view === '4.0') { el.innerHTML = renderUnit40(); update40(); }
      else if (STATE.view === '6.0') { el.innerHTML = renderUnit60(); renderPQ(); }
      else if (STATE.view === '7.0') { el.innerHTML = renderUnit70(); initQS(); }
      else if (STATE.view === '8.0') { el.innerHTML = renderUnit80(); runCS(); }
      else if (STATE.view === '10.0') { el.innerHTML = renderUnit100(); renderUnit100DS(); }
      else if (STATE.view === '11.0') { el.innerHTML = renderUnit110(); renderUnit110DS(); }
      else if (STATE.view === '12.0') { el.innerHTML = renderUnit120(); initDefaultBST(); }
      else { el.innerHTML = renderHome(); updateHomeChart(16); }
    }

    renderSidebar();
    renderMain();
  </script>
</body>
</html>
