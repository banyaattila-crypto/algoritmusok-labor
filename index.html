<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLRS Algoritmus Labor — v0.5.0 (I. Rész + II. Rész: 6. fejezet Kupacrendezés)</title>
  <style>
    :root {
      --bg-page: #FAF8F5;
      --bg-card: #FFFFFF;
      --bg-subtle: #F3EFEA;
      --bg-code: #1E293B;
      --text-main: #0F172A;
      --text-muted: #475569;
      --text-code: #F8FAFC;
      --border: #E2DCD3;
      --accent-primary: #B45309;
      --accent-primary-soft: #FEF3C7;
      --accent-navy: #1E3A8A;
      --accent-navy-soft: #DBEAFE;
      --accent-green: #047857;
      --accent-green-soft: #D1FAE5;
      --accent-red: #B91C1C;
      --accent-red-soft: #FEE2E2;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      --font-serif: Georgia, "Times New Roman", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    body.dark {
      --bg-page: #0B1120;
      --bg-card: #111827;
      --bg-subtle: #1E293B;
      --bg-code: #020617;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --text-code: #E2E8F0;
      --border: #334155;
      --accent-primary: #F59E0B;
      --accent-primary-soft: rgba(245, 158, 11, 0.16);
      --accent-navy: #60A5FA;
      --accent-navy-soft: rgba(96, 165, 250, 0.16);
      --accent-green: #34D399;
      --accent-green-soft: rgba(52, 211, 153, 0.16);
      --accent-red: #F87171;
      --accent-red-soft: rgba(248, 113, 113, 0.16);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.65;
      transition: background 0.2s, color 0.2s;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }
    .brand-badge {
      background: var(--accent-primary);
      color: #fff;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 700;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      padding: 0.42rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent-primary); }
    .btn-primary {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.8rem; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Layout */
    .app-shell {
      display: grid;
      grid-template-columns: 295px 1fr;
      min-height: calc(100vh - 57px);
    }
    aside {
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 1.25rem 1rem;
      overflow-y: auto;
      max-height: calc(100vh - 57px);
      position: sticky;
      top: 57px;
    }
    main {
      padding: 2rem clamp(1rem, 4vw, 3rem);
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    /* Sidebar Navigation */
    .nav-section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 700;
      margin: 1rem 0 0.45rem;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.52rem 0.7rem;
      border-radius: 6px;
      font-size: 0.86rem;
      cursor: pointer;
      margin-bottom: 0.25rem;
      border: 1px solid transparent;
      gap: 0.4rem;
    }
    .nav-item:hover { background: var(--bg-subtle); }
    .nav-item.active {
      background: var(--accent-primary-soft);
      border-color: var(--accent-primary);
      font-weight: 700;
    }
    .nav-item.locked {
      opacity: 0.55;
      cursor: default;
    }
    .status-pill {
      font-size: 0.7rem;
      padding: 0.12rem 0.42rem;
      border-radius: 99px;
      font-weight: 700;
      white-space: nowrap;
    }
    .pill-done { background: var(--accent-green-soft); color: var(--accent-green); }
    .pill-ready { background: var(--accent-navy-soft); color: var(--accent-navy); }
    .pill-soon { background: var(--bg-subtle); color: var(--text-muted); }

    /* Cards & Typography */
    .hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: 4px solid var(--accent-primary);
      border-radius: 10px;
      padding: 2rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
    }
    .book-meta {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--accent-primary);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.7rem, 3.2vw, 2.35rem);
      line-height: 1.22;
      margin-bottom: 0.75rem;
    }
    h2 {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      margin: 1.75rem 0 0.75rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border);
    }
    h3 {
      font-size: 1.05rem;
      margin: 1.2rem 0 0.5rem;
    }
    p { margin-bottom: 0.85rem; }

    .section-block {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.35rem;
      box-shadow: var(--shadow);
    }
    .section-tag {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-primary);
      background: var(--accent-primary-soft);
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    /* Math & Code */
    .math-box {
      background: var(--bg-subtle);
      border-left: 3px solid var(--accent-navy);
      padding: 0.9rem 1.1rem;
      border-radius: 0 6px 6px 0;
      font-family: var(--font-serif);
      font-size: 1.02rem;
      margin: 0.85rem 0;
      overflow-x: auto;
    }
    .pseudocode {
      background: var(--bg-code);
      color: var(--text-code);
      font-family: var(--font-mono);
      font-size: 0.86rem;
      border-radius: 8px;
      padding: 1rem 0;
      overflow-x: auto;
      margin: 0.85rem 0;
    }
    .code-line {
      padding: 0.22rem 1rem;
      display: flex;
      gap: 0.85rem;
    }
    .code-line.active-line {
      background: rgba(245, 158, 11, 0.28);
      border-left: 3px solid #F59E0B;
    }
    .line-no {
      color: #64748B;
      user-select: none;
      min-width: 1.4rem;
      text-align: right;
    }

    /* Labs & Controls */
    .lab-panel {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.15rem;
      margin: 1rem 0;
    }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }
    input[type="text"], input[type="number"], select {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.42rem 0.65rem;
      border-radius: 6px;
      font-size: 0.88rem;
    }
    .array-bars {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0.65rem;
      min-height: 185px;
      padding: 1.25rem 0.5rem 0.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 0.75rem 0;
    }
    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      min-width: 44px;
    }
    .bar-rect {
      width: 40px;
      border-radius: 5px 5px 0 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 0.35rem;
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      transition: height 0.2s, background 0.2s;
      background: #475569;
    }
    .bar-sorted { background: var(--accent-green); }
    .bar-key { background: var(--accent-primary); }
    .bar-compare { background: var(--accent-navy); }
    .bar-idx { font-size: 0.74rem; color: var(--text-muted); font-family: var(--font-mono); }

    /* Heap Array Strip */
    .heap-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: center;
      margin: 0.75rem 0;
    }
    .heap-cell {
      border: 1px solid var(--border);
      background: var(--bg-card);
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
      min-width: 52px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.84rem;
    }
    .heap-cell.active { border-color: var(--accent-primary); background: var(--accent-primary-soft); font-weight: 700; }
    .heap-cell.compare { border-color: var(--accent-navy); background: var(--accent-navy-soft); font-weight: 700; }
    .heap-cell.sorted { border-color: var(--accent-green); background: var(--accent-green-soft); }
    .heap-cell.outside { opacity: 0.55; }

    .var-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.6rem;
      margin: 0.75rem 0;
    }
    .var-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.84rem;
    }

    /* Tables & TOC */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.9rem 0;
      font-size: 0.88rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.55rem 0.75rem;
      text-align: left;
    }
    th { background: var(--bg-subtle); font-weight: 700; }

    .toc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 0.9rem;
      margin-top: 1rem;
    }
    .toc-part {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }

    /* Quiz */
    .quiz-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.85rem;
      background: var(--bg-card);
    }
    .quiz-opt {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.8rem;
      margin-top: 0.45rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-subtle);
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.88rem;
    }
    .quiz-opt:hover { border-color: var(--accent-primary); }
    .feedback {
      margin-top: 0.6rem;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.86rem;
      font-weight: 500;
    }
    .fb-ok { background: var(--accent-green-soft); color: var(--accent-green); }
    .fb-err { background: var(--accent-red-soft); color: var(--accent-red); }

    svg.chart {
      width: 100%;
      max-height: 290px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    @media (max-width: 860px) {
      .app-shell { grid-template-columns: 1fr; }
      aside {
        position: static;
        max-height: none;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand" onclick="navigate('home')">
      <span class="brand-badge">CLRS v0.5.0</span>
      <span class="brand-title">Algoritmus Labor</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-sm" onclick="navigate('home')">Kezdőlap</button>
      <button class="btn btn-sm" id="themeBtn" onclick="toggleTheme()">Sötét mód</button>
    </div>
  </header>

  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main id="content"></main>
  </div>

  <script>
    const STATE = {
      view: 'home',
      dark: false,
      completed: {},
      quizSolved: {}
    };

    try {
      const saved = JSON.parse(localStorage.getItem('clrs_labor_v050') || '{}');
      if (saved.view) STATE.view = saved.view;
      if (saved.dark) STATE.dark = saved.dark;
      if (saved.completed) STATE.completed = saved.completed;
      if (saved.quizSolved) STATE.quizSolved = saved.quizSolved;
    } catch (e) {}

    function saveState() {
      try {
        localStorage.setItem('clrs_labor_v050', JSON.stringify(STATE));
      } catch (e) {}
    }

    if (STATE.dark) {
      document.body.classList.add('dark');
      document.getElementById('themeBtn').textContent = 'Világos mód';
    }

    function toggleTheme() {
      STATE.dark = !STATE.dark;
      document.body.classList.toggle('dark', STATE.dark);
      document.getElementById('themeBtn').textContent = STATE.dark ? 'Világos mód' : 'Sötét mód';
      saveState();
    }

    const UNITS = [
      { id: '1.1', part: 'I. Rész: Alapok', title: '1.1 Algoritmusok', prereq: 'Nincs (kiindulópont)', ready: true },
      { id: '1.2', part: 'I. Rész: Alapok', title: '1.2 Az algoritmusok mint technológia', prereq: '1.1 Algoritmusok', ready: true },
      { id: '2.1', part: 'I. Rész: Alapok', title: '2.1 Beszúró rendezés (Insertion Sort)', prereq: '1.1–1.2, tömbindexelés', ready: true },
      { id: '2.2', part: 'I. Rész: Alapok', title: '2.2 Algoritmusok elemzése', prereq: '2.1, számtani sorozatok', ready: true },
      { id: '2.3', part: 'I. Rész: Alapok', title: '2.3 Oszd meg és uralkodj (Merge Sort)', prereq: '2.1–2.2, rekurzió', ready: true },
      { id: '3.0', part: 'I. Rész: Alapok', title: '3. Függvények növekedése (O, Ω, Θ, o, ω)', prereq: '2.2–2.3, határértékek', ready: true },
      { id: '4.0', part: 'I. Rész: Alapok', title: '4. Oszd meg és uralkodj és a Mester-tétel', prereq: '2.3, 3. fejezet', ready: true },
      { id: '6.0', part: 'II. Rész: Rendezés és rendstatisztikák', title: '6. Kupacrendezés (Heapsort & Prioritási sorok)', prereq: 'I. Rész (1–4. fejezet), teljes bináris fák', ready: true },
      { id: '7.0', part: 'II. Rész: Rendezés és rendstatisztikák', title: '7. Gyorsrendezés (Quicksort) [Következő]', prereq: '2.3, 4. fejezet, 6. fejezet', ready: false },
      { id: '8.0', part: 'II. Rész: Rendezés és rendstatisztikák', title: '8. Lineáris idejű rendezések [Tervezett]', prereq: '6–7. fejezet', ready: false },
      { id: '10.0', part: 'III. Rész: Adatszerkezetek', title: '10–14. Elemi adatszerkezetek, Fák [Tervezett]', prereq: 'I–II. Rész', ready: false },
      { id: '15.0', part: 'IV. Rész: Haladó tervezés', title: '15–17. Dinamikus programozás, Mohó [Tervezett]', prereq: 'I–III. Rész', ready: false },
      { id: '22.0', part: 'VI. Rész: Gráfalgoritmusok', title: '22–26. Gráfbejárás, Legrövidebb utak [Tervezett]', prereq: 'I–IV. Rész', ready: false }
    ];

    function navigate(id) {
      STATE.view = id;
      saveState();
      renderSidebar();
      renderMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function markComplete(id) {
      STATE.completed[id] = !STATE.completed[id];
      saveState();
      renderSidebar();
      renderMain();
    }

    function renderSidebar() {
      const doneCount = UNITS.filter(u => u.ready && STATE.completed[u.id]).length;
      const totalReady = UNITS.filter(u => u.ready).length;
      let html = `
        <div style="margin-bottom:1rem; padding:0.75rem; background:var(--bg-subtle); border-radius:8px;">
          <div style="font-size:0.78rem; color:var(--text-muted); font-weight:700;">TANULÁSI HALADÁS (I–II. RÉSZ)</div>
          <div style="font-size:1.15rem; font-weight:700; margin:0.2rem 0;">${doneCount} / ${totalReady} aktív egység kész</div>
          <div style="height:6px; background:var(--border); border-radius:99px; overflow:hidden;">
            <div style="height:100%; width:${Math.round((doneCount/totalReady)*100)}%; background:var(--accent-green);"></div>
          </div>
        </div>
        <div class="nav-item ${STATE.view === 'home' ? 'active' : ''}" onclick="navigate('home')">
          <span>Könyvborító & Tartalom</span>
          <span class="status-pill pill-ready">Start</span>
        </div>
      `;

      let currentPart = '';
      for (const u of UNITS) {
        if (u.part !== currentPart) {
          currentPart = u.part;
          html += `<div class="nav-section-title">${currentPart}</div>`;
        }
        const pill = !u.ready
          ? '<span class="status-pill pill-soon">Hamarosan</span>'
          : STATE.completed[u.id]
            ? '<span class="status-pill pill-done">Kész</span>'
            : '<span class="status-pill pill-ready">Aktív</span>';
        html += `
          <div class="nav-item ${STATE.view === u.id ? 'active' : ''} ${!u.ready ? 'locked' : ''}"
               onclick="${u.ready ? `navigate('${u.id}')` : ''}">
            <span>${u.title}</span>
            ${pill}
          </div>
        `;
      }
      document.getElementById('sidebar').innerHTML = html;
    }

    function renderHome() {
      return `
        <div class="hero-card">
          <div class="book-meta">Thomas H. Cormen • Charles E. Leiserson • Ronald L. Rivest • Clifford Stein</div>
          <h1>Algoritmusok — Interaktív Laboratórium</h1>
          <p style="font-size:1.05rem; color:var(--text-muted);">
            Minden algoritmust először intuitíven megértünk, utána determinisztikus lépésenkénti szimulátorban működés közben látunk, majd matematikailag is bizonyítunk és elemzünk — szigorúan a könyv eredeti sorrendjében.
          </p>
          <div class="controls-row" style="margin-top:1.25rem; margin-bottom:0;">
            <button class="btn btn-primary" onclick="navigate('1.1')">Tanulás indítása az 1.1. fejezettől →</button>
            <button class="btn" onclick="navigate('6.0')">Új: 6. fejezet (Kupacrendezés / Heapsort)</button>
          </div>
        </div>

        <div class="section-block">
          <span class="section-tag">Élő előnézet</span>
          <h2>Aszimptotikus növekedési nagyságrendek (n = 1 … 64)</h2>
          <p>Állítsd a bemeneti méretet (<strong>n</strong>), és figyeld meg, miért válik az algoritmusválasztás döntő tényezővé nagy adathalmazoknál:</p>
          <div class="controls-row">
            <label>Bemeneti méret (n): <strong id="homeNVal">16</strong></label>
            <input type="range" min="4" max="64" value="16" oninput="updateHomeChart(this.value)" />
          </div>
          <div id="homeChartBox"></div>
        </div>

        <h2>A könyv szerkezete (I–VIII. Rész)</h2>
        <div class="toc-grid">
          <div class="toc-part">
            <span class="status-pill pill-done">Kész • 1–4. fejezet</span>
            <h3>I. Rész: Alapok</h3>
            <p style="font-size:0.88rem; color:var(--text-muted);">1. Az algoritmusok szerepe • 2. Kezdeti lépések (Insertion Sort, Merge Sort) • 3. Függvények növekedése • 4. Oszd meg és uralkodj (Mester-tétel).</p>
          </div>
          <div class="toc-part">
            <span class="status-pill pill-ready">Aktív • 6. fejezet kész</span>
            <h3>II. Rész: Rendezés és rendstatisztikák</h3>
            <p style="font-size:0.88rem; color:var(--text-muted);"><strong>6. Kupacrendezés (Heapsort & Prioritási sorok) [KÉSZ]</strong> • 7. Gyorsrendezés • 8. Lineáris idejű rendezések • 9. Medián és rendstatisztikák.</p>
          </div>
          <div class="toc-part">
            <span class="status-pill pill-soon">Tervezett • 10–14. fejezet</span>
            <h3>III. Rész: Adatszerkezetek</h3>

    /* ==================== UNIT 2.1: INSERTION SORT ==================== */
    let IS_STEPS = [];
    let IS_IDX = 0;

    function buildInsertionSteps(arrInput) {
      const A = [...arrInput];
      const n = A.length;
      const steps = [];
      steps.push({
        arr: [...A], j: 2, i: null, key: null, line: 1,
        inv: `Inicializálás (j = 2): Az A[1..1] = [${A[0]}] résztömb triviálisan rendezett.`,
        desc: 'Kezdőállapot: a 2. elemtől indulunk (1-alapú CLRS indexelés).'
      });

      for (let j = 2; j <= n; j++) {
        const key = A[j - 1];
        steps.push({
          arr: [...A], j, i: null, key, line: 2,
          inv: `A ciklus kezdetén A[1..${j-1}] = [${A.slice(0, j-1).join(', ')}] rendezett.`,
          desc: `Kiemeljük a key = A[${j}] = ${key} elemet.`
        });
        let i = j - 1;
        steps.push({
          arr: [...A], j, i, key, line: 4,
          inv: `A[1..${j-1}] rendezett; keressük a ${key} helyét balra haladva.`,
          desc: `Mutató beállítása: i = j - 1 = ${i}.`
        });

        while (i > 0 && A[i - 1] > key) {
          steps.push({
            arr: [...A], j, i, key, line: 5,
            inv: `A[${i}] = ${A[i-1]} > key (${key}), ezért jobbra csúsztatjuk.`,
            desc: `Feltétel igaz (i=${i} > 0 és A[${i}]=${A[i-1]} > ${key}).`
          });
          A[i] = A[i - 1];
          steps.push({
            arr: [...A], j, i, key, line: 6,
            inv: `A[${i+1}] helyére másoltuk a ${A[i-1]} értéket.`,
            desc: `Eltolás: A[${i+1}] = A[${i}] (${A[i-1]}).`
          });
          i = i - 1;
        }
        A[i] = key;
        steps.push({
          arr: [...A], j, i, key, line: 8,
          inv: `Befejezés / Fenntartás: A[1..${j}] = [${A.slice(0, j).join(', ')}] most már rendezett!`,
          desc: `Beszúrás: A[${i+1}] = ${key}.`
        });
      }
      steps.push({
        arr: [...A], j: n + 1, i: null, key: null, line: 1,
        inv: `Befejezés (j = ${n+1} > n): A teljes A[1..${n}] tömb rendezett!`,
        desc: 'Az INSERTION-SORT algoritmus befejeződött.'
      });
      return steps;
    }

          <strong>3. Befejezés:</strong> A ciklus <code>j = n + 1</code> értéknél áll le, ekkor az invariáns szerint <code>A[1..n]</code> a teljes tömb rendezett elemeit tartalmazza.</p>

    function initIS() {
      const inp = document.getElementById('isInput');
      if (!inp) return;
      const arr = inp.value.split(',').map(x => Number(x.trim())).filter(x => !Number.isNaN(x));
      if (arr.length < 2) return;
      IS_STEPS = buildInsertionSteps(arr);
      IS_IDX = 0;
      renderISStep();
    }

    function stepIS(delta) {
      if (!IS_STEPS.length) return;
      IS_IDX = Math.max(0, Math.min(IS_STEPS.length - 1, IS_IDX + delta));
      renderISStep();
    }

    function renderISStep() {
      const s = IS_STEPS[IS_IDX];
      if (!s) return;
      const maxVal = Math.max(...s.arr, 1);
      document.getElementById('isCounter').textContent = `Lépés: ${IS_IDX + 1} / ${IS_STEPS.length}`;
      document.getElementById('isBars').innerHTML = s.arr.map((v, idx) => {
        const oneIdx = idx + 1;
        let cls = 'bar-rect';
        if (oneIdx === s.j) cls += ' bar-key';
        else if (oneIdx === s.i) cls += ' bar-compare';
        else if (oneIdx < s.j) cls += ' bar-sorted';
        const h = Math.max(30, Math.round((v / maxVal) * 145));
        return `<div class="bar-col"><div class="${cls}" style="height:${h}px">${v}</div><span class="bar-idx">A[${oneIdx}]</span></div>`;
      }).join('');

      document.getElementById('isVars').innerHTML = `
        <div class="var-card"><strong>j:</strong> ${s.j}</div>
        <div class="var-card"><strong>i:</strong> ${s.i ?? '—'}</div>
        <div class="var-card"><strong>key:</strong> ${s.key ?? '—'}</div>
        <div class="var-card"><strong>Állapot:</strong> ${s.desc}</div>
      `;
      document.getElementById('isInvBox').innerHTML = `<strong>Ciklusinvariáns-állapot:</strong> ${s.inv}`;
      document.querySelectorAll('#isCode .code-line').forEach(el => {
        el.classList.toggle('active-line', Number(el.dataset.line) === s.line);
      });
    }

        <div class="section-block">

          <p>Jelölje <em>t<sub>j</sub></em> azt, ahányszor az 5. sor <code>while</code> feltétele kiértékelődik egy adott <em>j</em> értékre:</p>

    /* ==================== UNIT 2.3: MERGE SORT ==================== */
    let MS_STEPS = [];
    let MS_IDX = 0;

    function buildMergeSortSteps(inputArr) {
      const steps = [];
      function rec(arr, p, r, depth) {
        steps.push({
          sub: [...arr], p, r, depth, phase: 'Felosztás (Divide)',
          desc: p < r
            ? `MERGE-SORT(A, ${p}, ${r}) — középpont q = ⌊(${p}+${r})/2⌋ = ${Math.floor((p+r)/2)}`
            : `Alapeset (p = r = ${p}): egyetlen elem [${arr[0]}], már rendezett.`
        });
        if (p < r) {
          const q = Math.floor((p + r) / 2);
          const mid = q - p + 1;
          const left = rec(arr.slice(0, mid), p, q, depth + 1);
          const right = rec(arr.slice(mid), q + 1, r, depth + 1);
          const merged = [];
          let i = 0, j = 0;
          while (i < left.length && j < right.length) {
            if (left[i] <= right[j]) merged.push(left[i++]);
            else merged.push(right[j++]);
          }
          while (i < left.length) merged.push(left[i++]);
          while (j < right.length) merged.push(right[j++]);
          steps.push({
            sub: [...merged], p, r, depth, phase: 'Összefésülés (MERGE)',
            desc: `MERGE(A, ${p}, ${q}, ${r}): [${left.join(', ')}] + [${right.join(', ')}] → [${merged.join(', ')}]`
          });
          return merged;
        }
        return arr;
      }
      rec(inputArr, 1, inputArr.length, 0);
      return steps;
    }

    /* ==================== UNIT 6.0: HEAPSORT & PRIORITY QUEUES ==================== */
    let HEAP_STEPS = [];
    let HEAP_IDX = 0;
    let PQ_ARRAY = [16, 14, 10, 8, 7, 9, 3, 2, 4, 1];
    let PQ_LOG = 'Kezdeti max-kupac betöltve (10 elem).';

    function buildHeapsortSteps(inputArr) {
      const A = [...inputArr];
      const n = A.length;
      let heapSize = n;
      const steps = [];

      function snap(phase, line, active, compare, desc, inv) {
        steps.push({
          arr: [...A],
          heapSize,
          n,
          phase,
          line,
          active: [...active],
          compare: [...compare],
          desc,
          inv
        });
      }

      function maxHeapify(i) {
        const l = 2 * i;
        const r = 2 * i + 1;
        let largest = i;
        const cmp = [];
        if (l <= heapSize) cmp.push(l);
        if (r <= heapSize) cmp.push(r);

        snap(
          'MAX-HEAPIFY',
          2,
          [i],
          cmp,
          `MAX-HEAPIFY(A, ${i}): vizsgáljuk az i = ${i} (A[${i}]=${A[i-1]}) csúcsot és gyerekeit (${cmp.map(c => `A[${c}]=${A[c-1]}`).join(', ') || 'nincs gyerek'}).`,
          `Az i=${i} csúcs bal (2i=${l}) és jobb (2i+1=${r}) részfája már max-kupac.`
        );

        if (l <= heapSize && A[l - 1] > A[largest - 1]) largest = l;
        if (r <= heapSize && A[r - 1] > A[largest - 1]) largest = r;

        if (largest !== i) {
          snap(
            'MAX-HEAPIFY (Csere)',
            8,
            [i, largest],
            [],
            `Csere: A[${i}] (${A[i-1]}) ↔ A[${largest}] (${A[largest-1]}), majd lesüllyesztés a ${largest}. csúcsra.`,
            `A legnagyobb elem (A[${largest}]=${A[largest-1]}) felkerül a szülő pozíciójába.`
          );
          const tmp = A[i - 1];
          A[i - 1] = A[largest - 1];
          A[largest - 1] = tmp;
          maxHeapify(largest);
        }
      }

      snap(
        'Kezdőállapot',
        1,
        [],
        [],
        `Bemeneti tömb betöltve (A.length = ${n}). Az első nem-levél csúcs: ⌊n/2⌋ = ${Math.floor(n/2)}.`,
        `A ⌊n/2⌋+1 .. n indexű elemek mind 1 elemű levelek, így triviálisan max-kupacok.`
      );

      for (let i = Math.floor(n / 2); i >= 1; i--) {
        snap(
          'BUILD-MAX-HEAP',
          2,
          [i],
          [],
          `BUILD-MAX-HEAP ciklus: i = ${i} csúcs lesüllyesztése.`,
          `Ciklusinvariáns (6.3. fejezet): minden i+1, i+2, …, n csúcs egy-egy max-kupac gyökere.`
        );
        maxHeapify(i);
      }

      snap(
        'Max-kupac kész',
        3,
        [1],
        [],
        `A teljes tömb max-kupaccá alakult! A legnagyobb elem a gyökérben: A[1] = ${A[0]}.`,
        `Teljesül a max-kupac tulajdonság minden 1 ≤ i ≤ ${n} csúcsra: A[PARENT(i)] ≥ A[i].`
      );

      for (let i = n; i >= 2; i--) {
        snap(
          'HEAPSORT (Gyökér kiemelése)',
          4,
          [1, i],
          [],
          `HEAPSORT iteráció (i = ${i}): megcseréljük a maximumot A[1]=${A[0]} és a kupac utolsó elemét A[${i}]=${A[i-1]}.`,
          `Ciklusinvariáns (6.4. fejezet): A[1..${i}] max-kupac, míg A[${i+1}..${n}] már tartalmazza a ${n-i} legnagyobb elemet rendezve.`
        );
        const tmp = A[0];
        A[0] = A[i - 1];
        A[i - 1] = tmp;
        heapSize--;
        snap(
          'HEAPSORT (Kupacméret csökkentése)',
          5,
          [1],
          [],
          `A[${i}] = ${A[i-1]} végleges helyére került! A.heap-size = ${heapSize}. Hívjuk a MAX-HEAPIFY(A, 1)-et.`,
          `A[1..${heapSize}] gyökere sértheti a kupactulajdonságot, de bal és jobb részfája továbbra is max-kupac.`
        );
        maxHeapify(1);
      }

      heapSize = 0;
      snap(
        'HEAPSORT Befejezve',
        6,
        [],
        [],
        `A rendezés befejeződött! Eredmény: [${A.join(', ')}].`,
        `Befejezés: A[1..${n}] teljesen növekvő sorrendben rendezett, helyben (O(1) segédmemóriával).`
      );

      return steps;
    }

    function renderHeapTreeSvg(arr, heapSize, active, compare) {
      const n = arr.length;
      if (!n) return '';
      const W = 640;
      const H = 265;
      const coords = {};
      for (let i = 1; i <= n; i++) {
        const level = Math.floor(Math.log2(i));
        const levelStart = Math.pow(2, level);
        const posInLevel = i - levelStart;
        const nodesInLevel = levelStart;
        const x = ((posInLevel + 0.5) / nodesInLevel) * (W - 60) + 30;
        const y = 38 + level * 68;
        coords[i] = { x, y };
      }

      let edges = '';
      for (let i = 2; i <= n; i++) {
        const p = Math.floor(i / 2);
        const c1 = coords[p];
        const c2 = coords[i];
        const inHeap = i <= heapSize;
        edges += `<line x1="${c1.x}" y1="${c1.y}" x2="${c2.x}" y2="${c2.y}" stroke="${inHeap ? '#64748B' : '#CBD5E1'}" stroke-width="${inHeap ? '2' : '1.2'}" stroke-dasharray="${inHeap ? '' : '4 4'}" />`;
      }

      let nodes = '';
      for (let i = 1; i <= n; i++) {
        const { x, y } = coords[i];
        const inHeap = i <= heapSize;
        let fill = inHeap ? '#1E293B' : '#047857';
        let stroke = inHeap ? '#475569' : '#047857';
        if (active.includes(i)) {
          fill = '#B45309';
          stroke = '#F59E0B';
        } else if (compare.includes(i)) {
          fill = '#1E3A8A';
          stroke = '#60A5FA';
        }
        nodes += `
          <g>
            <circle cx="${x}" cy="${y}" r="18" fill="${fill}" stroke="${stroke}" stroke-width="2.5" opacity="${inHeap ? '1' : '0.88'}" />
            <text x="${x}" y="${y + 4}" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="monospace">${arr[i - 1]}</text>
            <text x="${x}" y="${y - 22}" text-anchor="middle" fill="#64748B" font-size="10" font-family="monospace">[${i}]</text>
          </g>
        `;
      }

      return `<svg class="chart" viewBox="0 0 ${W} ${H}">${edges}${nodes}</svg>`;
    }

    function initHeap() {
      const inp = document.getElementById('heapInput');
      if (!inp) return;
      const arr = inp.value.split(',').map(x => Number(x.trim())).filter(x => !Number.isNaN(x)).slice(0, 15);
      if (arr.length < 2) return;
      HEAP_STEPS = buildHeapsortSteps(arr);
      HEAP_IDX = 0;
      renderHeapStep();
    }

    function stepHeap(d) {
      if (!HEAP_STEPS.length) return;
      HEAP_IDX = Math.max(0, Math.min(HEAP_STEPS.length - 1, HEAP_IDX + d));
      renderHeapStep();
    }

    function renderHeapStep() {
      const s = HEAP_STEPS[HEAP_IDX];
      if (!s) return;
      document.getElementById('heapCounter').textContent = `Lépés: ${HEAP_IDX + 1} / ${HEAP_STEPS.length}`;
      document.getElementById('heapTreeBox').innerHTML = renderHeapTreeSvg(s.arr, s.heapSize, s.active, s.compare);
      document.getElementById('heapArrayBox').innerHTML = s.arr.map((v, idx) => {
        const i = idx + 1;
        let cls = 'heap-cell';
        if (s.active.includes(i)) cls += ' active';
        else if (s.compare.includes(i)) cls += ' compare';
        else if (i > s.heapSize) cls += ' sorted';
        return `<div class="${cls}"><div style="font-size:0.68rem;color:var(--text-muted);">A[${i}]</div><div>${v}</div></div>`;
      }).join('');

      document.getElementById('heapVars').innerHTML = `
        <div class="var-card"><strong>Fázis:</strong> ${s.phase}</div>
        <div class="var-card"><strong>A.length:</strong> ${s.n}</div>
        <div class="var-card"><strong>A.heap-size:</strong> ${s.heapSize}</div>
        <div class="var-card"><strong>Rendezett rész:</strong> ${s.n - s.heapSize} elem</div>
      `;
      document.getElementById('heapInvBox').innerHTML = `<strong>Művelet:</strong> ${s.desc}<br/><strong>Invariáns / Tulajdonság:</strong> ${s.inv}`;
      document.querySelectorAll('#heapCode .code-line').forEach(el => {
        el.classList.toggle('active-line', Number(el.dataset.line) === s.line);
      });
    }

    function pqMaxHeapify(A, i) {
      const n = A.length;
      while (true) {
        const l = 2 * i;
        const r = 2 * i + 1;
        let largest = i;
        if (l <= n && A[l - 1] > A[largest - 1]) largest = l;
        if (r <= n && A[r - 1] > A[largest - 1]) largest = r;
        if (largest !== i) {
          const tmp = A[i - 1];
          A[i - 1] = A[largest - 1];
          A[largest - 1] = tmp;
          i = largest;
        } else {
          break;
        }
      }
    }

    function pqExtractMax() {
      if (PQ_ARRAY.length === 0) {
        PQ_LOG = 'Kupac alulcsordulás (heap underflow): a prioritási sor üres!';
        renderPQ();
        return;
      }
      const max = PQ_ARRAY[0];
      const last = PQ_ARRAY.pop();
      if (PQ_ARRAY.length > 0) {
        PQ_ARRAY[0] = last;
        pqMaxHeapify(PQ_ARRAY, 1);
      }
      PQ_LOG = `HEAP-EXTRACT-MAX(A) → Visszaadott maximum: ${max}. Az utolsó elem (${last}) a gyökérbe került, majd MAX-HEAPIFY(A, 1) helyreállította a kupacot O(lg n) időben.`;
      renderPQ();
    }

    function pqInsert() {
      if (PQ_ARRAY.length >= 15) {
        PQ_LOG = 'A vizuális laborban legfeljebb 15 elem jeleníthető meg egyszerre.';
        renderPQ();
        return;
      }
      const val = Number(document.getElementById('pqInsertVal').value);
      if (Number.isNaN(val)) return;
      PQ_ARRAY.push(val);
      let i = PQ_ARRAY.length;
      let swaps = 0;
      while (i > 1 && PQ_ARRAY[Math.floor(i / 2) - 1] < PQ_ARRAY[i - 1]) {
        const p = Math.floor(i / 2);
        const tmp = PQ_ARRAY[p - 1];
        PQ_ARRAY[p - 1] = PQ_ARRAY[i - 1];
        PQ_ARRAY[i - 1] = tmp;
        i = p;
        swaps++;
      }
      PQ_LOG = `MAX-HEAP-INSERT(A, ${val}) → Beszúrva a végére, majd HEAP-INCREASE-KEY ${swaps} szülő-cserével felfelé buborékoltatta a helyére O(lg n) időben.`;
      renderPQ();
    }

    function pqReset() {
      PQ_ARRAY = [16, 14, 10, 8, 7, 9, 3, 2, 4, 1];
      PQ_LOG = 'Kezdeti max-kupac visszaállítva (10 elem).';
      renderPQ();
    }

    function renderPQ() {
      const st = document.getElementById('pqStatus');
      if (!st) return;
      st.textContent = PQ_LOG;
      document.getElementById('pqTreeBox').innerHTML = PQ_ARRAY.length
        ? renderHeapTreeSvg(PQ_ARRAY, PQ_ARRAY.length, [1], [])
        : '<div style="padding:1rem; text-align:center; color:var(--text-muted);">A prioritási sor jelenleg üres.</div>';
      document.getElementById('pqArrayBox').innerHTML = PQ_ARRAY.map((v, idx) => `
        <div class="heap-cell ${idx === 0 ? 'active' : ''}">
          <div style="font-size:0.68rem;color:var(--text-muted);">A[${idx + 1}]</div>
          <div>${v}</div>
        </div>
      `).join('');
    }

        el.innerHTML = renderUnit30();
        update30();
      } else if (STATE.view === '4.0') {
        el.innerHTML = renderUnit40();
        update40();
      } else if (STATE.view === '6.0') {
        el.innerHTML = renderUnit60();
        initHeap();
        renderPQ();
      } else {
        el.innerHTML = renderHome();
        updateHomeChart(16);
      }
    }

    renderSidebar();
    renderMain();
  </script>
</body>
</html>
