<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLRS Algoritmus Labor — v0.7.0</title>
  <style>
    :root {
      --bg-page: #FAF8F5;
      --bg-card: #FFFFFF;
      --bg-subtle: #F3EFEA;
      --bg-code: #1E293B;
      --text-main: #0F172A;
      --text-muted: #475569;
      --text-code: #F8FAFC;
      --border: #E2DCD3;
      --accent-primary: #B45309;
      --accent-primary-soft: #FEF3C7;
      --accent-navy: #1E3A8A;
      --accent-navy-soft: #DBEAFE;
      --accent-green: #047857;
      --accent-green-soft: #D1FAE5;
      --accent-red: #B91C1C;
      --accent-red-soft: #FEE2E2;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      --font-serif: "Times New Roman", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    body.dark {
      --bg-page: #0B1120;
      --bg-card: #111827;
      --bg-subtle: #1E293B;
      --bg-code: #020617;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --text-code: #E2E8F0;
      --border: #334155;
      --accent-primary: #F59E0B;
      --accent-primary-soft: rgba(245, 158, 11, 0.16);
      --accent-navy: #60A5FA;
      --accent-navy-soft: rgba(96, 165, 250, 0.16);
      --accent-green: #34D399;
      --accent-green-soft: rgba(52, 211, 153, 0.16);
      --accent-red: #F87171;
      --accent-red-soft: rgba(248, 113, 113, 0.16);
      --shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.65;
      transition: background 0.3s, color 0.3s;
    }

    /* --- 3D Forgó Logó --- */
    .logo-container {
      perspective: 400px;
      width: 28px;
      height: 28px;
      margin-right: 0.5rem;
    }
    .cube {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 8s infinite linear;
    }
    .face {
      position: absolute;
      width: 28px; height: 28px;
      border: 2px solid var(--accent-primary);
      background: var(--accent-primary-soft);
      opacity: 0.85;
      box-shadow: inset 0 0 8px rgba(245, 158, 11, 0.4);
    }
    .face.front  { transform: translateZ(14px); }
    .face.back   { transform: rotateY(180deg) translateZ(14px); }
    .face.right  { transform: rotateY(90deg) translateZ(14px); }
    .face.left   { transform: rotateY(-90deg) translateZ(14px); }
    .face.top    { transform: rotateX(90deg) translateZ(14px); }
    .face.bottom { transform: rotateX(-90deg) translateZ(14px); }
    
    @keyframes rotateCube {
      0%   { transform: rotateX(0deg) rotateY(0deg); }
      100% { transform: rotateX(360deg) rotateY(360deg); }
    }

    /* --- Header --- */
    header {
      position: sticky; top: 0; z-index: 50;
      background: var(--bg-card); border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .brand { display: flex; align-items: center; cursor: pointer; }
    .brand-badge {
      background: var(--accent-primary); color: #fff; font-weight: 700; font-size: 0.78rem;
      padding: 0.25rem 0.55rem; border-radius: 4px; letter-spacing: 0.05em; margin-right: 0.6rem;
    }
    .brand-title { font-family: var(--font-serif); font-size: 1.15rem; font-weight: 700; }
    .header-actions { display: flex; align-items: center; gap: 0.6rem; }
    .btn {
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main);
      padding: 0.42rem 0.85rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent-primary); }
    .btn-primary { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }
    .btn-primary:hover { opacity: 0.92; }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.8rem; }

    /* --- Elrendezés --- */
    .app-shell { display: grid; grid-template-columns: 295px 1fr; min-height: calc(100vh - 57px); }
    aside { background: var(--bg-card); border-right: 1px solid var(--border); padding: 1.25rem 1rem; overflow-y: auto; max-height: calc(100vh - 57px); position: sticky; top: 57px; }
    main { padding: 2rem clamp(1rem, 4vw, 3rem); max-width: 1100px; width: 100%; margin: 0 auto; }

    /* --- Könyv Nyitóoldal --- */
    .book-cover-hero {
      position: relative; background: linear-gradient(135deg, #1E293B, #0F172A); border-radius: 12px;
      padding: 4rem 2rem; color: #F8FAFC; text-align: center; box-shadow: var(--shadow);
      border: 1px solid var(--border); border-top: 5px solid var(--accent-primary); margin-bottom: 2.5rem; overflow: hidden;
    }
    .book-cover-hero::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(circle at center, rgba(245, 158, 11, 0.1) 0%, transparent 70%); pointer-events: none;
    }
    .book-cover-authors { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.15em; color: #94A3B8; margin-bottom: 1.5rem; font-weight: 700; }
    .book-cover-title { font-family: var(--font-serif); font-size: clamp(2.5rem, 5vw, 4.2rem); line-height: 1.1; margin-bottom: 1rem; color: #FFFFFF; text-shadow: 0 4px 12px rgba(0,0,0,0.3); }
    .book-cover-subtitle { font-size: 1.15rem; color: #CBD5E1; font-weight: 300; max-width: 650px; margin: 0 auto 2.5rem; }

    /* --- Tipográfia és kártyák --- */
    .hero-card { background: var(--bg-card); border: 1px solid var(--border); border-top: 4px solid var(--accent-primary); border-radius: 10px; padding: 2rem; box-shadow: var(--shadow); margin-bottom: 2rem; }
    .book-meta { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent-primary); font-weight: 700; margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.7rem, 3.2vw, 2.35rem); line-height: 1.22; margin-bottom: 0.75rem; }
    h2 { font-family: var(--font-serif); font-size: 1.4rem; margin: 1.75rem 0 0.75rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--border); }
    p { margin-bottom: 0.85rem; }

    .section-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.35rem; box-shadow: var(--shadow); }
    .section-tag { display: inline-block; font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-primary); background: var(--accent-primary-soft); padding: 0.2rem 0.55rem; border-radius: 4px; margin-bottom: 0.5rem; }

    /* --- Matematika és Kód --- */
    .math-box { background: var(--bg-subtle); border-left: 3px solid var(--accent-navy); padding: 0.9rem 1.1rem; border-radius: 0 6px 6px 0; font-family: var(--font-serif); font-size: 1.02rem; margin: 0.85rem 0; overflow-x: auto; }
    .pseudocode { background: var(--bg-code); color: var(--text-code); font-family: var(--font-mono); font-size: 0.86rem; border-radius: 8px; padding: 1rem 0; overflow-x: auto; margin: 0.85rem 0; }
    .code-line { padding: 0.22rem 1rem; display: flex; gap: 0.85rem; }
    .code-line.active-line { background: rgba(245, 158, 11, 0.28); border-left: 3px solid #F59E0B; }
    .line-no { color: #64748B; user-select: none; min-width: 1.4rem; text-align: right; }

    /* --- Vezérlők és Labor panelek --- */
    .lab-panel { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 8px; padding: 1.15rem; margin: 1rem 0; }
    .controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.65rem; margin-bottom: 1rem; }
    input[type="text"] { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 0.42rem 0.65rem; border-radius: 6px; font-size: 0.88rem; }
    
    .var-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.6rem; margin: 0.75rem 0; }
    .var-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 0.55rem 0.75rem; font-family: var(--font-mono); font-size: 0.84rem; }

    /* --- C-tömb és B-tömb (Counting Sort) --- */
    .cs-array-box { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .cs-cell {
      border: 1px solid var(--border); background: var(--bg-card); border-radius: 6px; padding: 0.4rem 0.6rem;
      min-width: 48px; text-align: center; font-family: var(--font-mono); font-size: 0.9rem;
      transition: all 0.2s;
    }
    .cs-cell.highlight { border-color: var(--accent-primary); background: var(--accent-primary-soft); font-weight: 700; transform: scale(1.05); }
    .cs-cell.active-c { border-color: var(--accent-green); background: var(--accent-green-soft); font-weight: 700; }
    .cs-cell.active-b { border-color: var(--accent-navy); background: var(--accent-navy-soft); font-weight: 700; color: #fff;}
    .cs-label { font-size: 0.7rem; color: var(--text-muted); display: block; margin-bottom: 2px; }
    
    /* --- Navigáció --- */
    .nav-section-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 700; margin: 1rem 0 0.45rem; }
    .nav-item { display: flex; align-items: center; justify-content: space-between; padding: 0.52rem 0.7rem; border-radius: 6px; font-size: 0.86rem; cursor: pointer; margin-bottom: 0.25rem; border: 1px solid transparent; gap: 0.4rem; }
    .nav-item:hover { background: var(--bg-subtle); }
    .nav-item.active { background: var(--accent-primary-soft); border-color: var(--accent-primary); font-weight: 700; }
    .nav-item.locked { opacity: 0.55; cursor: default; }
    .status-pill { font-size: 0.7rem; padding: 0.12rem 0.42rem; border-radius: 99px; font-weight: 700; white-space: nowrap; }
    .pill-done { background: var(--accent-green-soft); color: var(--accent-green); }
    .pill-ready { background: var(--accent-navy-soft); color: var(--accent-navy); }
    .pill-soon { background: var(--bg-subtle); color: var(--text-muted); }
    
    .toc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0.9rem; margin-top: 1rem; }
    .toc-part { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    
    .quiz-item { border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 0.85rem; background: var(--bg-card); }
    .quiz-opt { display: block; width: 100%; text-align: left; padding: 0.55rem 0.8rem; margin-top: 0.45rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-subtle); color: var(--text-main); cursor: pointer; font-size: 0.88rem; }
    .quiz-opt:hover { border-color: var(--accent-primary); }
    .feedback { margin-top: 0.6rem; padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.86rem; font-weight: 500; }
    .fb-ok { background: var(--accent-green-soft); color: var(--accent-green); }
    .fb-err { background: var(--accent-red-soft); color: var(--accent-red); }

    @media (max-width: 860px) {
      .app-shell { grid-template-columns: 1fr; }
      aside { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body class="dark">
  <header>
    <div class="brand" onclick="navigate('home')">
      <div class="logo-container">
        <div class="cube">
          <div class="face front"></div><div class="face back"></div>
          <div class="face right"></div><div class="face left"></div>
          <div class="face top"></div><div class="face bottom"></div>
        </div>
      </div>
      <span class="brand-badge">CLRS v0.7.0</span>
      <span class="brand-title">Algoritmus Labor</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-sm" onclick="navigate('home')">Kezdőlap</button>
      <button class="btn btn-sm" id="themeBtn" onclick="toggleTheme()">Világos mód</button>
    </div>
  </header>

  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main id="content"></main>
  </div>

  <script>
    const STATE = { view: 'home', dark: true, completed: {}, quizSolved: {} };

    try {
      const saved = JSON.parse(localStorage.getItem('clrs_labor_v070'));
      if (saved) {
        if (saved.view) STATE.view = saved.view;
        if (typeof saved.dark === 'boolean') STATE.dark = saved.dark;
        if (saved.completed) STATE.completed = saved.completed;
        if (saved.quizSolved) STATE.quizSolved = saved.quizSolved;
      }
    } catch (e) {}

    function saveState() { try { localStorage.setItem('clrs_labor_v070', JSON.stringify(STATE)); } catch (e) {} }

    document.body.classList.toggle('dark', STATE.dark);
    document.getElementById('themeBtn').textContent = STATE.dark ? 'Világos mód' : 'Sötét mód';

    function toggleTheme() {
      STATE.dark = !STATE.dark;
      document.body.classList.toggle('dark', STATE.dark);
      document.getElementById('themeBtn').textContent = STATE.dark ? 'Világos mód' : 'Sötét mód';
      saveState();
    }

    const UNITS = [
      { id: '1.1', part: 'I. Rész: Alapok', title: '1.1 Algoritmusok', prereq: 'Nincs', ready: true },
      { id: '2.1', part: 'I. Rész: Alapok', title: '2.1 Beszúró rendezés', prereq: '1.1', ready: true },
      { id: '2.3', part: 'I. Rész: Alapok', title: '2.3 Oszd meg és uralkodj', prereq: '2.1', ready: true },
      { id: '4.0', part: 'I. Rész: Alapok', title: '4. Mester-tétel', prereq: '2.3', ready: true },
      { id: '6.0', part: 'II. Rész: Rendezés és rendstatisztikák', title: '6. Kupacrendezés', prereq: 'I. Rész', ready: true },
      { id: '7.0', part: 'II. Rész: Rendezés és rendstatisztikák', title: '7. Gyorsrendezés', prereq: '6.0', ready: true },
      { id: '8.0', part: 'II. Rész: Rendezés és rendstatisztikák', title: '8. Lineáris idejű rendezések', prereq: '7.0', ready: true },
      { id: '9.0', part: 'II. Rész: Rendezés és rendstatisztikák', title: '9. Medián és rendstatisztikák [Tervezett]', prereq: '8.0', ready: false },
      { id: '10.0', part: 'III. Rész: Adatszerkezetek', title: '10–14. Elemi adatszerkezetek [Tervezett]', prereq: 'I–II', ready: false }
    ];

    function navigate(id) {
      STATE.view = id;
      saveState();
      renderSidebar();
      renderMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function markComplete(id) {
      STATE.completed[id] = !STATE.completed[id];
      saveState();
      renderSidebar();
      renderMain();
    }

    function renderSidebar() {
      const doneCount = UNITS.filter(u => u.ready && STATE.completed[u.id]).length;
      const totalReady = UNITS.filter(u => u.ready).length;
      let html = `<div style="margin-bottom:1rem; padding:0.75rem; background:var(--bg-subtle); border-radius:8px;">
          <div style="font-size:0.78rem; color:var(--text-muted); font-weight:700;">HALADÁS</div>
          <div style="font-size:1.15rem; font-weight:700; margin:0.2rem 0;">${doneCount} / ${totalReady} kész</div>
          <div style="height:6px; background:var(--border); border-radius:99px; overflow:hidden;"><div style="height:100%; width:${Math.round((doneCount/totalReady)*100)}%; background:var(--accent-green);"></div></div>
        </div>
        <div class="nav-item ${STATE.view === 'home' ? 'active' : ''}" onclick="navigate('home')"><span>Nyitóoldal & Tartalom</span><span class="status-pill pill-ready">Start</span></div>`;
      let currentPart = '';
      for (const u of UNITS) {
        if (u.part !== currentPart) {
          currentPart = u.part;
          html += `<div class="nav-section-title">${currentPart}</div>`;
        }
        const pill = !u.ready ? '<span class="status-pill pill-soon">Terv</span>' : STATE.completed[u.id] ? '<span class="status-pill pill-done">Kész</span>' : '<span class="status-pill pill-ready">Aktív</span>';
        html += `<div class="nav-item ${STATE.view === u.id ? 'active' : ''} ${!u.ready ? 'locked' : ''}" onclick="${u.ready ? `navigate('${u.id}')` : ''}"><span>${u.title}</span> ${pill}</div>`;
      }
      document.getElementById('sidebar').innerHTML = html;
    }

    function renderHome() {
      return `
        <div class="book-cover-hero">
          <div class="book-cover-authors">Thomas H. Cormen • Charles E. Leiserson • Ronald L. Rivest • Clifford Stein</div>
          <h1 class="book-cover-title">ALGORITMUSOK</h1>
          <div class="book-cover-subtitle">Harmadik kiadás (Interaktív Laboratórium)</div>
          <button class="btn btn-primary" style="padding: 0.8rem 1.5rem; font-size: 1rem;" onclick="navigate('8.0')">
            Új: 8. fejezet (Lineáris idejű rendezések) indítása →
          </button>
        </div>

        <h2>A könyv szerkezete</h2>
        <div class="toc-grid">
          <div class="toc-part"><span class="status-pill pill-done">Kész</span><h3>I. Rész: Alapok</h3><p style="font-size:0.88rem; color:var(--text-muted);">Algoritmus elemzés, Rendezések (n² és n lg n), Θ, Mester-tétel.</p></div>
          <div class="toc-part"><span class="status-pill pill-ready">Aktív</span><h3>II. Rész: Rendezés</h3><p style="font-size:0.88rem; color:var(--text-muted);">Heapsort, Quicksort, <strong>8. Lineáris idejű rendezések (Kész)</strong></p></div>
          <div class="toc-part"><span class="status-pill pill-soon">Hamarosan</span><h3>III-VI. Rész: Továbbiak</h3><p style="font-size:0.88rem; color:var(--text-muted);">Fák, Gráfok, DP, Mohó stratégiák.</p></div>
        </div>
      `;
    }

    /* ==================== UNIT 8.0: LINEAR SORTING (COUNTING SORT) ==================== */
    let CS_STEPS = [];
    let CS_IDX = 0;

    function buildCountingSortSteps(A, k) {
      const steps = [];
      const n = A.length;
      const C = new Array(k + 1).fill(0);
      const B = new Array(n).fill(null);

      function snapshot(phase, line, desc, hlA=null, hlC=null, hlB=null) {
        steps.push({ phase, line, desc, A: [...A], C: [...C], B: [...B], hlA, hlC, hlB, k });
      }

      snapshot("Inicializálás", 1, `C[0..${k}] = 0. Létrehozzuk a C gyakorisági tömböt k+1 mérettel.`);

      for (let j = 0; j < n; j++) {
        C[A[j]]++;
        snapshot("Számlálás", 4, `A[${j+1}] = ${A[j]}. Növeljük C[${A[j]}] értékét 1-gyel.`, j, A[j], null);
      }
      snapshot("Számlálás kész", 5, `C[i] most azt mutatja, hányszor szerepel i az A tömbben.`);

      for (let i = 1; i <= k; i++) {
        C[i] = C[i] + C[i - 1];
        snapshot("Kumulatív összeg", 7, `C[${i}] = C[${i}] + C[${i-1}]. C[${i}] = ${C[i]}. Most C[i] azt mutatja, hány elem <= i.`, null, i, null);
      }

      for (let j = n - 1; j >= 0; j--) {
        const val = A[j];
        const pos = C[val] - 1; // 0-indexed for JS array B
        B[pos] = val;
        snapshot("Elhelyezés (Stabilitás!)", 10, `A[${j+1}] = ${val}. C[${val}] = ${C[val]}, így ${val} a B[${C[val]}] (0-index szerint B[${pos}]) helyre kerül.`, j, val, pos);
        C[val]--;
        snapshot("Frissítés", 11, `Csökkentjük C[${val}] értékét, hogy a következő ${val} érték eggyel balra kerüljön.`, null, val, null);
      }

      snapshot("Kész", null, `Az A tömb rendezve lett a B tömbbe O(n+k) időben!`);
      return steps;
    }

    function renderUnit80() {
      return unitShell('8.0', '8. Lineáris idejű rendezések (Counting Sort, Radix Sort)', 'II. Rész • 8. fejezet: Az alsó korlát áttörése', `
        <div class="section-block">
          <span class="section-tag">A–C. Az összehasonlító rendezések alsó korlátja (8.1)</span>
          <p>Minden olyan rendező algoritmus, amely csak elemek <strong>összehasonlításán</strong> (<code>&lt;, &le;, &gt;, &ge;</code>) alapul (mint a Merge Sort, Heapsort, Quicksort), a legrosszabb esetben <strong>&Omega;(n lg n)</strong> összehasonlítást igényel. Ezt egy döntési fával bizonyíthatjuk, amelynek $n!$ levele van (minden lehetséges permutáció), és egy bináris fa magassága, aminek $n!$ levele van, legalább $\\lg(n!) = \\Theta(n \\lg n)$.</p>
          <p>Hogyan lehet ennél gyorsabban, <strong>lineáris időben (O(n))</strong> rendezni? Úgy, hogy <em>nem hasonlítjuk össze</em> az elemeket, hanem kihasználjuk az értékükről szerzett többletinformációt (például, hogy kis egész számok)!</p>
        </div>

        <div class="section-block">
          <span class="section-tag">D. Interaktív COUNTING-SORT Labor (8.2)</span>
          <p>A Leszámláló rendezés feltételezi, hogy minden bemeneti elem egy egész szám a $0$ és $k$ közötti tartományban. A $C$ tömbben összeszámolja az elemek gyakoriságát, majd a kumulatív összegből megmondja, pontosan hová (melyik indexre) kell kerülnie az elemnek a $B$ kimeneti tömbben.</p>
          
          <div class="lab-panel">
            <div class="controls-row">
              <label>A tömb (számok 0 és k között):</label>
              <input type="text" id="csInput" value="2, 5, 3, 0, 2, 3, 0, 3" />
              <label>k (max érték):</label>
              <input type="text" id="csK" value="5" style="width:60px;" />
              <button class="btn btn-primary" onclick="initCS()">Futtatás</button>
              <button class="btn" onclick="stepCS(-1)">← Előző</button>
              <button class="btn" onclick="stepCS(1)">Következő →</button>
              <span id="csCounter" style="font-size:0.84rem; font-weight:700;"></span>
            </div>

            <div class="var-grid" style="grid-template-columns: 100px 1fr;">
              <div style="font-weight:bold; align-self:center;">A (bemenet):</div>
              <div id="csArrayA" class="cs-array-box"></div>
              
              <div style="font-weight:bold; align-self:center;">C (számláló):</div>
              <div id="csArrayC" class="cs-array-box"></div>
              
              <div style="font-weight:bold; align-self:center;">B (kimenet):</div>
              <div id="csArrayB" class="cs-array-box"></div>
            </div>

            <div id="csDesc" class="math-box" style="margin-top:1rem;"></div>

            <div class="pseudocode" id="csCode">
              <div class="code-line" data-line="1"><span class="line-no">1</span><span>let C[0..k] be a new array initialized to 0</span></div>
              <div class="code-line" data-line="3"><span class="line-no">3</span><span><strong>for</strong> j = 1 <strong>to</strong> A.length</span></div>
              <div class="code-line" data-line="4"><span class="line-no">4</span><span>&nbsp;&nbsp;&nbsp;&nbsp;C[A[j]] = C[A[j]] + 1</span></div>
              <div class="code-line" data-line="6"><span class="line-no">6</span><span><strong>for</strong> i = 1 <strong>to</strong> k</span></div>
              <div class="code-line" data-line="7"><span class="line-no">7</span><span>&nbsp;&nbsp;&nbsp;&nbsp;C[i] = C[i] + C[i - 1]</span></div>
              <div class="code-line" data-line="9"><span class="line-no">9</span><span><strong>for</strong> j = A.length <strong>downto</strong> 1</span></div>
              <div class="code-line" data-line="10"><span class="line-no">10</span><span>&nbsp;&nbsp;&nbsp;&nbsp;B[C[A[j]]] = A[j]</span></div>
              <div class="code-line" data-line="11"><span class="line-no">11</span><span>&nbsp;&nbsp;&nbsp;&nbsp;C[A[j]] = C[A[j]] - 1</span></div>
            </div>
          </div>
        </div>

        <div class="section-block">
          <span class="section-tag">E. Radix Sort és Bucket Sort (8.3 - 8.4)</span>
          <div class="math-box">
            <strong>Radix Sort (Számjegyes rendezés):</strong> Ha a számok túl nagyok (pl. $k = n^3$, ahol a Counting Sort $O(n^3)$ lenne), a számokat $d$ db számjegyre bontjuk. A legkisebb helyiértéktől haladunk a legnagyobb felé, és minden számjegyen végrehajtunk egy <strong>stabil</strong> rendezést (pl. Counting Sort). Futásidő: <strong>&Theta;(d(n+k))</strong>.<br/><br/>
            <strong>Bucket Sort (Edényrendezés):</strong> A $[0, 1)$ intervallumban egyenletesen eloszló valós számok rendezésére. A $[0, 1)$ intervallumot $n$ db egyenlő méretű "edényre" (bucket) osztjuk. A bemeneti elemeket beszórjuk az edényekbe, minden edényt külön rendezünk (Insertion Sort), majd összefűzzük őket. Várható futásidő: <strong>O(n)</strong>.
          </div>
        </div>
      `, [
        {
          q: '1. Miért MÁSODRENDŰ (kritikus) fontosságú, hogy a Counting Sort "stabil" (stable) rendezés legyen?',
          opts: [
            'Mert a stabilitás garantálja a lineáris O(n+k) futásidőt.',
            'Mert a Radix Sort olyan stabil segédrendezésre épít, amely megőrzi az azonos értékű számjegyek korábbi (kisebb helyiértékű) relatív sorrendjét.'
          ],
          ans: 1,
          exp: 'A Radix Sort csak akkor működik helyesen a legkisebb helyiértéktől (LSD) a legnagyobbig haladva, ha a segédrendezés stabil, és nem rontja el a már korábban rendezett helyiértékeket.'
        },
        {
          q: '2. Mi a Counting Sort idő- és memóriabonyolultsága (A[1..n], max érték k)?',
          opts: [
            'Θ(n + k) idő és Θ(k) extra memória (a C tömb miatt, ha B a kimenet).',
            'Θ(n lg n) idő és O(1) memória.'
          ],
          ans: 0,
          exp: 'A ciklusok n, k és n lépést tesznek meg, így az idő Θ(n+k). Memóriában egy k méretű C tömbre és egy n méretű B kimeneti tömbre van szükség.'
        }
      ]);
    }

    function initCS() {
      const inp = document.getElementById('csInput');
      const kInp = document.getElementById('csK');
      if (!inp || !kInp) return;
      const arr = inp.value.split(',').map(x => Number(x.trim())).filter(x => !Number.isNaN(x) && x >= 0);
      const k = parseInt(kInp.value, 10);
      if (arr.length < 1 || isNaN(k)) return;
      CS_STEPS = buildCountingSortSteps(arr, k);
      CS_IDX = 0;
      renderCSStep();
    }

    function stepCS(d) {
      if (!CS_STEPS.length) return;
      CS_IDX = Math.max(0, Math.min(CS_STEPS.length - 1, CS_IDX + d));
      renderCSStep();
    }

    function renderCSStep() {
      const s = CS_STEPS[CS_IDX];
      if (!s) return;
      document.getElementById('csCounter').textContent = `Lépés: ${CS_IDX + 1} / ${CS_STEPS.length}`;
      
      // Render A
      document.getElementById('csArrayA').innerHTML = s.A.map((v, i) => 
        `<div class="cs-cell ${s.hlA === i ? 'highlight' : ''}"><span class="cs-label">A[${i+1}]</span>${v}</div>`
      ).join('');
      
      // Render C
      document.getElementById('csArrayC').innerHTML = s.C.map((v, i) => 
        `<div class="cs-cell ${s.hlC === i ? 'active-c' : ''}"><span class="cs-label">C[${i}]</span>${v}</div>`
      ).join('');

      // Render B
      document.getElementById('csArrayB').innerHTML = s.B.map((v, i) => 
        `<div class="cs-cell ${s.hlB === i ? 'active-b' : ''}"><span class="cs-label">B[${i+1}]</span>${v !== null ? v : '-'}</div>`
      ).join('');

      document.getElementById('csDesc').innerHTML = `<strong>${s.phase}:</strong> ${s.desc}`;
      
      document.querySelectorAll('#csCode .code-line').forEach(el => {
         el.classList.remove('active-line');
         if (s.line && Number(el.dataset.line) === s.line) {
             el.classList.add('active-line');
         }
      });
    }

    /* ==================== EGYSÉG VÁZ (Shared) ==================== */
    function unitShell(id, title, subtitle, bodyHtml, quizzes) {
      const u = UNITS.find(x => x.id === id);
      const isDone = !!STATE.completed[id];
      const quizHtml = quizzes.map((q, idx) => {
        const key = `${id}_${idx}`;
        const picked = STATE.quizSolved[key];
        return `<div class="quiz-item"><strong>${q.q}</strong>
            ${q.opts.map((opt, oi) => `<button class="quiz-opt" onclick="answerQuiz('${id}', ${idx}, ${oi}, ${q.ans})">${opt}</button>`).join('')}
            ${picked !== undefined ? `<div class="feedback ${picked === q.ans ? 'fb-ok' : 'fb-err'}">${picked === q.ans ? 'Helyes válasz! ' : 'Nem pontos. '}${q.exp}</div>` : ''}
          </div>`;
      }).join('');

      return `<div class="hero-card" style="padding:1.5rem;">
          <div class="book-meta">${subtitle}</div><h1 style="margin-bottom:0.35rem;">${title}</h1>
          <div style="font-size:0.86rem; color:var(--text-muted);"><strong>Szükséges előismeretek:</strong> ${u ? u.prereq : ''}</div>
        </div>
        ${bodyHtml}
        <div class="section-block"><span class="section-tag">Ellenőrző kérdések</span>${quizHtml}
          <div class="controls-row" style="margin-top:1rem; margin-bottom:0; justify-content:space-between;">
            <button class="btn ${isDone ? '' : 'btn-primary'}" onclick="markComplete('${id}')">${isDone ? '✓ Teljesítve' : 'Egység megjelölése teljesítettként'}</button>
            <button class="btn" onclick="navigate('home')">Vissza a tartalomjegyzékhez</button>
          </div>
        </div>`;
    }

    function answerQuiz(unitId, qIdx, choice, correct) { STATE.quizSolved[`${unitId}_${qIdx}`] = choice; saveState(); renderMain(); }

    function renderMain() {
      const el = document.getElementById('content');
      if (STATE.view === 'home') { el.innerHTML = renderHome(); } 
      else if (STATE.view === '8.0') { el.innerHTML = renderUnit80(); initCS(); } 
      else {
        el.innerHTML = `<div class="hero-card"><h1>Régebbi fejezetek...</h1><p>Válassz a menüből a megjelenítéshez (jelenleg a 8. fejezet az aktív demonstráció).</p></div>`;
      }
    }

    renderSidebar();
    renderMain();
  </script>
</body>
